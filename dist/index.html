<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Live service display for Al Raked Car Washing Station">
    <title>Al Raked Live Display</title>
    <link rel="icon" type="image/png" href="/raked-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="display" aria-labelledby="display-title">
      <header class="display-header">
        <div class="brand">
          <img class="brand-logo" src="/raked-icon.png" alt="">
          <h1 id="display-title">AL RAKED CAR WASHING STATION</h1>
        </div>
        <div class="clock" aria-label="Current date and time">
          <span class="clock-calendar">
            <span id="clock-date" class="clock-date">02 OCT</span>
            <span id="clock-hijri-date" class="clock-hijri-date" lang="ar" dir="rtl">٢١ ربيع الآخر</span>
          </span>
          <span class="clock-time">
            <span id="clock-hours">00</span><span class="clock-colon" aria-hidden="true">:</span><span id="clock-minutes">00</span>
          </span>
        </div>
        <div class="connection sr-only" aria-live="polite"><span id="connection-text">Connecting</span></div>
      </header>

      <section class="feed" aria-label="Latest ten service entries">
        <div class="feed-head" role="row" aria-hidden="true">
          <span>Time</span>
          <span>Employee</span>
          <span>Vehicle</span>
          <span>Service</span>
          <span class="price-cell">Price</span>
          <span>Status</span>
        </div>
        <div id="entries" class="entries" role="rowgroup" aria-live="polite"></div>
        <div id="empty-state" class="empty-state">
          <p>Waiting for the first service entry</p>
        </div>
      </section>
    </main>

    <section id="promo-player" class="promo-player" aria-hidden="true">
      <video id="promo-video" class="promo-video" muted playsinline preload="metadata" disablepictureinpicture></video>
    </section>

    <audio id="ready-chime" src="/media/ready-chime.mp3" preload="auto"></audio>

    <template id="entry-template">
      <article class="entry" role="row">
        <div class="cell datetime-cell" role="cell" data-label="Time">
          <span class="entry-time"></span>
        </div>
        <div class="cell employee-cell scrollable-cell" role="cell" data-label="Employee"></div>
        <div class="cell plate-cell" role="cell" data-label="Vehicle">
          <div class="vehicle-plate is-abu-dhabi">
            <span class="plate-code">AD</span>
            <span class="dubai-code" aria-hidden="true">
              <span class="dubai-name">DUBAI</span>
              <span class="plate-letters"></span>
            </span>
            <span class="plate-number scrollable-cell"></span>
          </div>
        </div>
        <div class="cell service-cell scrollable-cell" role="cell" data-label="Service"></div>
        <div class="cell price-cell" role="cell" data-label="Price">
          <img class="dirham-symbol" src="/dirham.svg" alt="AED">
          <span class="price-value"></span>
        </div>
        <div class="cell status-cell" role="cell" data-label="Status">
          <span class="status-value"></span>
        </div>
      </article>
    </template>

    <section id="ready-alert" class="ready-alert" aria-hidden="true" aria-live="assertive">
      <div class="ready-alert-card">
        <p class="ready-alert-kicker">Vehicle</p>
        <strong id="ready-alert-plate" class="ready-alert-plate"></strong>
        <p class="ready-alert-message">is ready for pickup</p>
      </div>
    </section>

    <script src="/firebase-config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
