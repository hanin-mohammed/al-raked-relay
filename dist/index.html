<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Live service display for Al Raked Car Washing Station">
    <title>Al Raked Live Display</title>
    <link rel="icon" type="image/png" href="/raked-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="display" aria-labelledby="display-title">
      <header class="display-header">
        <div class="brand">
          <img class="brand-logo" src="/raked-icon.png" alt="">
          <h1 id="display-title">AL RAKED CAR WASHING STATION</h1>
        </div>
        <div class="clock" aria-label="Current time">
          <span id="clock-hours">00</span><span class="clock-colon" aria-hidden="true">:</span><span id="clock-minutes">00</span>
        </div>
        <div class="connection sr-only" aria-live="polite"><span id="connection-text">Connecting</span></div>
      </header>

      <section class="feed" aria-label="Latest ten service entries">
        <div class="feed-head" role="row" aria-hidden="true">
          <span>Date</span>
          <span>Time</span>
          <span>Employee</span>
          <span>Vehicle</span>
          <span>Service</span>
          <span class="price-cell">Price</span>
        </div>
        <div id="entries" class="entries" role="rowgroup" aria-live="polite"></div>
        <div id="empty-state" class="empty-state">
          <p>Waiting for the first service entry</p>
        </div>
      </section>
    </main>

    <template id="entry-template">
      <article class="entry" role="row">
        <div class="cell date-cell" role="cell" data-label="Date"></div>
        <div class="cell time-cell" role="cell" data-label="Time"></div>
        <div class="cell employee-cell" role="cell" data-label="Employee"></div>
        <div class="cell plate-cell" role="cell" data-label="Vehicle">
          <div class="abu-dhabi-plate">
            <span class="plate-code"></span>
            <span class="plate-emirate"><b lang="ar">الإمارات</b><small>U.A.E. A.D.</small></span>
            <span class="plate-number"></span>
          </div>
        </div>
        <div class="cell service-cell" role="cell" data-label="Service"></div>
        <div class="cell price-cell" role="cell" data-label="Price">
          <img class="dirham-symbol" src="/dirham.svg" alt="AED">
          <span class="price-value"></span>
        </div>
      </article>
    </template>

    <script src="/firebase-config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
