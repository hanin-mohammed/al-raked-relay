<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090b10">
    <meta name="description" content="Latest Al Raked service entries">
    <title>Al Raked Live Display</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090b10'/%3E%3Cpath d='M14 44 28 16h9l13 28h-9l-2-6H25l-3 6Zm14-13h8l-4-10Z' fill='%23f2b84b'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="display" aria-labelledby="display-title">
      <header class="display-header">
        <div>
          <p class="eyebrow">AL RAKED</p>
          <h1 id="display-title">Latest services</h1>
        </div>
        <div class="connection" aria-live="polite">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connection-text">Connecting</span>
        </div>
      </header>

      <section class="feed" aria-label="Latest ten service entries">
        <div class="feed-head" role="row" aria-hidden="true">
          <span>Time</span>
          <span>Foreman</span>
          <span>Employee</span>
          <span>Plate</span>
          <span>Service</span>
          <span>Company</span>
          <span class="price-cell">Price</span>
        </div>
        <div id="entries" class="entries" role="rowgroup" aria-live="polite"></div>
        <div id="empty-state" class="empty-state">
          <p>Waiting for the first service entry</p>
        </div>
      </section>
    </main>

    <template id="entry-template">
      <article class="entry" role="row">
        <div class="cell time-cell" role="cell" data-label="Time"></div>
        <div class="cell foreman-cell" role="cell" data-label="Foreman"></div>
        <div class="cell employee-cell" role="cell" data-label="Employee"></div>
        <div class="cell plate-cell" role="cell" data-label="Plate"></div>
        <div class="cell service-cell" role="cell" data-label="Service"></div>
        <div class="cell company-cell" role="cell" data-label="Company"></div>
        <div class="cell price-cell" role="cell" data-label="Price"></div>
      </article>
    </template>

    <script src="/firebase-config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
